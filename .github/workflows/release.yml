# Publishes to PyPI through Trusted Publishing: PyPI verifies the identity of
# this workflow via OIDC, so no API token is stored here or anywhere else.
#
# One-time setup on pypi.org (Publishing -> Add a pending publisher):
#   PyPI project name: alepe
#   Owner:             StrategicProjects
#   Repository:        alepe_py
#   Workflow name:     release.yml
#   Environment:       pypi
#
# Then publish a version by tagging it:
#   git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the artifacts
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
