on:
  workflow_dispatch:

name: probe

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: What the submission form serves now
        run: |
          curl -sS --max-time 45 -o form.html "https://xmpalantir.wu.ac.at/cransubmit/"
          echo "== bytes: $(wc -c < form.html)"
          echo "== form actions"
          grep -oE '<form[^>]*>' form.html | head -5
          echo "== title / headings"
          grep -oE '<title>[^<]*</title>|<h[12][^>]*>[^<]*</h[12]>' form.html | head -5
          echo "== any notice"
          grep -oiE '[^<>]*(maintenance|unavailable|moved|closed|suspend)[^<>]*' form.html | head -5
